[mod]
id = "fp_pal"
name = "First Person PAL Expansion"
group = "com.github.razorplay01"
version = "1.1.0"
channel_tag = ""
description = "An add-on for PAL that allows for the animation of the player's arms and items in first-person view."
authors = ["RazorPlay01"]
contributors = []
inception_year = "2026"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
sources_url = "https://github.com/RazorPlay01/First-Person-PAL-Expansion"
homepage_url = "https://github.com/RazorPlay01/First-Person-PAL-Expansion"
issues_url = "https://github.com/RazorPlay01/First-Person-PAL-Expansion/issues"
discord_url = "https://discord.gg/w5ECtBcz"
environment = "client_only"
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]
[[mod.pom.developers]]
id = "razorplay01"
name = "RazorPlay01"
url = "https://github.com/ghost"

